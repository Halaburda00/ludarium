[project]
name = "ludarium"
license = "AGPL-3.0-or-later"
version = "0.1.0"
description = "Self-hosted, web-based game library aggregator"
readme = "README.md"
authors = [
    { name = "Mateusz", email = "mateusz.halaburda00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.19.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.1",
]

# Regenerating `docs/openapi.json`, which the frontend's types are built from.
# An entry point rather than a `__main__` block: the block would be the one line
# in the package no test can reach.
[project.scripts]
ludarium-openapi = "ludarium.openapi:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
# Without this, the alembic/ directory in the project root makes ruff read the
# alembic package as first-party in some files and third-party in others.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src/ludarium --cov-report=term-missing"

[tool.coverage.run]
# SQLAlchemy's async layer crosses a greenlet on every await that touches the
# database, and the default tracer loses the frame on the way back: every line
# after the first such await in an endpoint reads as unexecuted. Without this,
# `api/auth.py` measures 71% while its tests exercise all of it.
concurrency = ["thread", "greenlet"]
