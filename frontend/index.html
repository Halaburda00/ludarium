<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Before the first paint, so a dark page does not flash white while the
      // bundle loads. The same key and rule as `src/lib/theme.ts`.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('ludarium.theme')
        } catch (error) {
          // Storage refused: no choice, so the system's preference decides.
        }
        var dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
