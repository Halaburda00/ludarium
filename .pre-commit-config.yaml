repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy src alembic'
        language: system
        types: [python]
        pass_filenames: false

      # The two commands from CLAUDE.md, run rather than remembered. A response
      # model and the types generated from it live on opposite sides of the
      # tree, and CI's two jobs are independent — so a half-done regeneration
      # was caught by the backend job after a push and by nothing before it.
      # Regenerates rather than checks: pre-commit fails a run whose hook
      # touched a file, so the diff is on disk and ready to stage.
      - id: openapi
        name: openapi document and the types built from it
        entry: bash -c 'cd backend && uv run ludarium-openapi > ../docs/openapi.json && cd ../frontend && pnpm run api:types'
        language: system
        # One line, not a folded scalar: YAML joins folded lines with a space,
        # and a space inside an alternation branch is part of the pattern.
        files: '^(backend/(src/ludarium/(api/|__init__\.py)|pyproject\.toml)|docs/openapi\.json|frontend/src/lib/api-types\.ts)'
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
